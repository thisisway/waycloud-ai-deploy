<html lang="pt-BR">

<body class="preview-view">
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M12 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/><path d="M11 13l9-9"/><path d="M15 4h5v5"/></symbol>

      <button type="button" class="dev-btn on" data-device="desktop" aria-pressed="true">Computador</button>
      <button type="button" class="dev-btn" data-device="tablet" aria-pressed="false">Tablet</button>
      <button type="button" class="dev-btn" data-device="mobile" aria-pressed="false">Celular</button>

    <a id="device-open" class="link-out" target="_blank" rel="noopener noreferrer"><span>Abrir em outra aba</span><svg class="ic"><use href="#i-external"/></svg></a>
  </header>
  <div id="device-page">
    <div id="device-stage" class="device-stage">
      <div id="device-frame" class="device-frame desktop">
        <iframe id="device-iframe" title="Prévia do seu site" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" referrerpolicy="no-referrer" loading="lazy"></iframe>

    </div>
