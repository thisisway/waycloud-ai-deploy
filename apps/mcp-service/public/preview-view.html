<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <title>Prévia do site · Way Cloud</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D66FF'/%3E%3Cpath d='M9 21a5 5 0 0 1 1-9.9A6 6 0 0 1 21.5 12 4.5 4.5 0 0 1 22 21z' fill='white'/%3E%3C/svg%3E">
  <link rel="preload" href="/fonts/plus-jakarta-sans-v12-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/site.css">
</head>
<body class="preview-view">
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-desktop" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></symbol>
    <symbol id="i-tablet" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></symbol>
    <symbol id="i-mobile" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="20" rx="2"/><path d="M11 18h2"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  </svg>
  <header class="view-bar">
    <a class="view-logo" href="https://waycloud.com.br"><img src="/waycloud-logo.svg" alt="Way Cloud"></a>
    <div class="seg" role="group" aria-label="Tamanho da tela">
      <button type="button" class="dev-btn on" data-device="desktop" aria-pressed="true"><svg class="ic sm"><use href="#i-desktop"/></svg><span>Computador</span></button>
      <button type="button" class="dev-btn" data-device="tablet" aria-pressed="false"><svg class="ic sm"><use href="#i-tablet"/></svg><span>Tablet</span></button>
      <button type="button" class="dev-btn" data-device="mobile" aria-pressed="false"><svg class="ic sm"><use href="#i-mobile"/></svg><span>Celular</span></button>
    </div>
    <a href="/" class="btn"><span>Contratar agora</span><svg class="ic"><use href="#i-arrow-right"/></svg></a>
  </header>
  <div id="device-page">
    <div id="device-stage" class="device-stage">
      <div id="device-frame" class="device-frame desktop">
        <iframe id="device-iframe" title="Prévia do seu site" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" referrerpolicy="no-referrer" loading="lazy"></iframe>
      </div>
    </div>
    <p id="device-size" class="device-size"></p>
  </div>
  <script type="module" src="/preview-view.js"></script>
</body>
</html>
