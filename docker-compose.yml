# Local development stack: Postgres, MinIO (S3 stand-in for Cloudflare R2), the preview edge and the MCP service.
#   docker compose up --build
# MCP endpoint:  http://localhost:13000/mcp       Previews: http://<slug>.localhost:8081
# MinIO console: http://localhost:19001 (waycloud / waycloud-dev-secret)

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: waycloud
      POSTGRES_PASSWORD: waycloud-dev
      POSTGRES_DB: waycloud_ai
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waycloud -d waycloud_ai"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: waycloud
      MINIO_ROOT_PASSWORD: waycloud-dev-secret
    ports: ["19000:9000", "19001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 20

  minio-init:
    image: minio/mc
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 waycloud waycloud-dev-secret &&
                  mc mb --ignore-existing local/waycloud-ai"
    restart: "no"

  preview-edge:
    build: ./preview-edge
    ports: ["8081:80"]
    volumes: ["previews:/srv/previews:ro"]

  mcp-service:
    build:
      context: .
      dockerfile: apps/mcp-service/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://waycloud:waycloud-dev@postgres:5432/waycloud_ai
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:19000 # what the uploader (outside Docker) calls
      S3_ACCESS_KEY_ID: waycloud
      S3_SECRET_ACCESS_KEY: waycloud-dev-secret
      S3_BUCKET: waycloud-ai
      PREVIEW_ROOT: /srv/previews
      PREVIEW_URL_TEMPLATE: http://{slug}.localhost:8081
      PORT: "3000"
    ports: ["13000:3000"]
    volumes: ["previews:/srv/previews"]

volumes:
  pgdata:
  miniodata:
  previews:
