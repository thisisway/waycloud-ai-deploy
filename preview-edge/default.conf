# Way Cloud preview edge: one static site per subdomain, <slug>.<any base domain> -> /srv/previews/<slug>.
# The slug is exactly 10 chars of [a-z2-7], so the folder name can never contain "/" or "..".

server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
    location / { return 404; }
}

server {
    listen 80;
    server_name "~^(?<slug>[a-z2-7]{10})\..+$";

    root /srv/previews/$slug;
    index index.html;
    charset utf-8;
    disable_symlinks on;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    # Discreet banner on every HTML page.
    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter '</body>' '<div style="position:fixed;bottom:0;left:0;right:0;z-index:2147483647;background:#0b3d91;color:#fff;font:13px/1.4 system-ui,sans-serif;padding:6px 12px;text-align:center;opacity:.95">Prévia Way Cloud · temporária</div></body>';

    # Dotfiles (including the SPA marker) are never served.
    location ~ /\. { return 404; }

    location / { try_files $uri $uri/ @fallback; }

    # Single-page apps: unknown paths fall back to index.html when the marker exists.
    location @fallback {
        if (-f $document_root/.waycloud-spa) { rewrite ^ /index.html break; }
        return 404;
    }
}
